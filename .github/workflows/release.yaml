name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  dists-artifact-name: python-package-distributions
jobs:
  build:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@33db207c963ad07b8d2bff4099143593fd4100b2
    permissions:
      contents: read
    with:
      changelog: CHANGELOG.md
      artifact-base-url: https://pypi.org/project/pytest-env/
  previous-tag:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          venv: ${{ runner.temp }}/release-tools
      - name: Add installed tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Select previous tag
        id: previous
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous=$(git tag --list | release-creator tags "$TAG" --previous)
          echo "tag=$previous" >>"$GITHUB_OUTPUT"
  contributor-metadata:
    needs: previous-tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Fetch contributor metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$PREVIOUS" ]]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f previous_tag_name="$PREVIOUS" \
              --jq .body >"$RUNNER_TEMP/generated-notes.md"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              --jq .body >"$RUNNER_TEMP/generated-notes.md"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
          retention-days: 1
  github-notes:
    needs: contributor-metadata
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          venv: ${{ runner.temp }}/release-tools
      - name: Add installed tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/contributor-metadata
      - uses: tox-dev/github-workflows/render-release-notes@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          tag: ${{ github.ref_name }}
          changelog: CHANGELOG.md
          repository: ${{ github.repository }}
          artifact-url: https://pypi.org/project/pytest-env/${{ github.ref_name }}/
          generated-notes: ${{ runner.temp }}/contributor-metadata/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1
  stage-github-release:
    needs: github-notes
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/github-release-notes
      - name: Stage GitHub Release draft
        uses: tox-dev/github-workflows/publish-github-release@33db207c963ad07b8d2bff4099143593fd4100b2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/github-release-notes/release-notes.md
          mode: stage
  stage:
    needs: [build, stage-github-release]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      missing-count: ${{ steps.missing.outputs.missing-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - id: missing
        uses: tox-dev/github-workflows/reconcile-pypi-artifacts@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          project: pytest-env
          version: ${{ github.ref_name }}
          dist: dist/
          mode: stage
          missing-dir: ${{ runner.temp }}/pypi-missing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-missing-manifest
          path: ${{ steps.missing.outputs.manifest }}
          if-no-files-found: error
  release:
    needs: [stage, stage-github-release, github-notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/pytest-env/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-missing-manifest
          path: ${{ runner.temp }}/pypi-missing-manifest
      - id: selected
        uses: tox-dev/github-workflows/select-pypi-artifacts@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          dist: dist/
          manifest: ${{ runner.temp }}/pypi-missing-manifest/pypi-missing-names.txt
          output-dir: pypi-upload
          expected-count: ${{ needs.stage.outputs.missing-count }}
      - name: Publish to PyPI
        if: steps.selected.outputs.selected-count != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-upload
          attestations: true
          skip-existing: true
  verify:
    needs: [release, stage-github-release]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          project: pytest-env
          version: ${{ github.ref_name }}
          dist: dist/
          mode: verify
  github-release:
    needs: [verify, stage-github-release, github-notes]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/github-release-notes
      - uses: tox-dev/github-workflows/publish-github-release@33db207c963ad07b8d2bff4099143593fd4100b2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/github-release-notes/release-notes.md
          mode: publish
