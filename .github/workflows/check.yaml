name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 8 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: 🧪 Test
    uses: tox-dev/github-workflows/.github/workflows/check.yaml@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
    permissions:
      contents: read
    with:
      include: |
        [
          {"env": "3.15"},
          {"env": "3.15t", "python": "3.15t"},
          {"env": "3.14", "python": "3.14"},
          {"env": "3.13", "python": "3.13"},
          {"env": "3.12", "python": "3.12"},
          {"env": "3.11", "python": "3.11"},
          {"env": "type"},
          {"env": "dev"},
          {"env": "pkg_meta"}
        ]
  gate:
    name: 🚦 Required checks pass
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test]
    runs-on: ubuntu-26.04
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
        with:
          needs: ${{ toJSON(needs) }}
